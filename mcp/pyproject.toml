[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachescope-mcp"
version = "0.1.0"
description = "MCP server exposing the cachescope memory-hierarchy simulator to LLM agents"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
cachescope-mcp = "cachescope_mcp.server:main"

[tool.setuptools]
packages = ["cachescope_mcp"]
