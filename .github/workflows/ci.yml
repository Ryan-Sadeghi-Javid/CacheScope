name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: appleclang

    steps:
      - uses: actions/checkout@v4

      - name: Cache the GoogleTest fetch
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ matrix.os }}-${{ matrix.compiler }}-gtest-v1.15.2

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCACHESCOPE_BUILD_TESTS=ON \
            -DCACHESCOPE_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  trace-compatibility:
    # Differential test against the simulator this project claims format
    # compatibility with. A mismatch here is a correctness regression, not a
    # style issue, so it gates the build.
    name: upstream differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cachescope
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCACHESCOPE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Fetch upstream traces and build the reference simulator
        run: |
          scripts/fetch_traces.sh
          git clone --depth 1 https://github.com/kev-kim/cache-simulator.git /tmp/upstream
          make -C /tmp/upstream

      - name: Compare all geometries against upstream
        run: |
          python3 scripts/validate_upstream.py \
            --csim /tmp/upstream/csim \
            --cachescope build/cachescope \
            --traces traces/upstream \
            --markdown docs/upstream_validation.md

      - uses: actions/upload-artifact@v4
        with:
          name: upstream-validation
          path: docs/upstream_validation.md

  benchmark:
    name: throughput benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCACHESCOPE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Fetch traces
        run: scripts/fetch_traces.sh

      - name: Measure simulator throughput
        run: |
          scripts/bench_throughput.sh build/cachescope traces/upstream/gcc.trace 6 \
            | tee throughput.txt

      - name: Smoke-test the CLI surface
        run: |
          set -e
          ./build/cachescope --help > /dev/null
          ./build/cachescope config -c configs/baseline.json > /dev/null
          ./build/cachescope run -c configs/baseline.json -t traces/upstream/swim.trace \
            --interval 50000 --csv /tmp/t.csv --jsonl /tmp/t.jsonl --json /tmp/s.json -q
          test -s /tmp/t.csv && test -s /tmp/t.jsonl && test -s /tmp/s.json
          python3 scripts/gen_branch_trace.py --pattern mixed --count 20000 \
            --out /tmp/b.trace
          ./build/cachescope branch -t /tmp/b.trace --compare
          # An invalid geometry must be rejected with a clear message, not crash.
          if ./build/cachescope run -c configs/baseline.json \
               -t traces/upstream/read01.trace --set levels.0.size_kb=3 -q 2>/tmp/err; then
            echo "expected a validation failure for a non-power-of-two geometry"; exit 1
          fi
          grep -q "power of two" /tmp/err

      - uses: actions/upload-artifact@v4
        with:
          name: throughput
          path: throughput.txt

  python-tools:
    name: python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pandas matplotlib mcp

      - name: Build simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCACHESCOPE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Fetch traces and generate a branch trace
        run: |
          scripts/fetch_traces.sh
          python3 scripts/gen_branch_trace.py --pattern mixed --count 50000 \
            --out traces/branch/sample.trace

      - name: Sweep, analyse and exercise the MCP tools
        env:
          CACHESCOPE_BIN: build/cachescope
          PYTHONPATH: mcp
        run: |
          python3 scripts/sweep.py --cachescope build/cachescope \
            --config configs/baseline.json --trace traces/upstream/gcc.trace \
            --sweep levels.0.size_kb=8,32,128 --sweep levels.0.assoc=1,8 \
            --out /tmp/sweep.csv
          build/cachescope run -c configs/baseline.json -t traces/upstream/swim.trace \
            --interval 20000 --csv /tmp/telemetry.csv -q
          python3 scripts/analyze.py --sweep-l1 /tmp/sweep.csv \
            --telemetry /tmp/telemetry.csv --outdir /tmp/figures
          test -f /tmp/figures/miss_rate_vs_size_light.png
          test -f /tmp/figures/mpki_over_time_dark.png
          python3 - <<'PY'
          from cachescope_mcp import server as s
          call = lambda t, **k: getattr(t, "fn", t)(**k)
          r = call(s.run_simulation, trace="swim", config="baseline")
          assert "run_id" in r, r
          d = call(s.diagnose, run_id=r["run_id"])
          assert d["headline"], d
          c = call(s.get_counters, run_id=r["run_id"], prefix="l1d.")
          assert c["count"] > 0, c
          sw = call(s.sweep, param="levels.1.size_kb", values=["128", "512"],
                    trace="swim", config="baseline")
          assert sw["best_by_cpi"], sw
          # A branch sweep without a branch trace must be refused, not silently
          # produce identical rows.
          bad = call(s.sweep, param="branch.predictor", values=["gshare"], trace="swim")
          assert "error" in bad, bad
          print("MCP tool surface OK")
          PY
